<style>
/* Layout: one reading column (max 1080px). Tool strip on top, then the report as a sequence of ledger sections. */
:root {
  --bg: #f6f7f5;
  --paper: #ffffff;
  --ink: #15201d;
  --ink-2: #4a5754;
  --ink-3: #74807c;
  --line: #dde2df;
  --line-2: #eef1ef;
  --accent: #0e6b58;
  --accent-soft: #e2f0eb;
  --good: #1d7a3e; --good-bg: #e3f3e8;
  --warn: #9a6200; --warn-bg: #fbefd6;
  --bad: #b3261e;  --bad-bg: #fbe4e1;
  --na: #74807c;   --na-bg: #eef1ef;
  --series-cur: #2a78d6;
  --series-prev: #b7c0bd;
  --seg-1: #2a78d6; --seg-2: #1baf7a; --seg-3: #eb6834; --seg-4: #eda100; --seg-5: #6250d6;
  --font-display: "Newsreader", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111615; --paper: #181e1d; --ink: #e9eeec; --ink-2: #b4bfbb; --ink-3: #8a9692;
  --line: #2c3533; --line-2: #212927; --accent: #4fc2a4; --accent-soft: #19332c;
  --good: #6fcf8d; --good-bg: #17301f; --warn: #e7b04a; --warn-bg: #352a12; --bad: #f08a80; --bad-bg: #3a1c19;
  --na: #8a9692; --na-bg: #232b29; --series-cur: #3987e5; --series-prev: #55615e; --seg-1: #3987e5; --seg-2: #199e70; --seg-3: #d95926; --seg-4: #c98500; --seg-5: #9085e9; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111615; --paper: #181e1d; --ink: #e9eeec; --ink-2: #b4bfbb; --ink-3: #8a9692;
  --line: #2c3533; --line-2: #212927; --accent: #4fc2a4; --accent-soft: #19332c;
  --good: #6fcf8d; --good-bg: #17301f; --warn: #e7b04a; --warn-bg: #352a12; --bad: #f08a80; --bad-bg: #3a1c19;
  --na: #8a9692; --na-bg: #232b29; --series-cur: #3987e5; --series-prev: #55615e; --seg-1: #3987e5; --seg-2: #199e70; --seg-3: #d95926; --seg-4: #c98500; --seg-5: #9085e9; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.45rem; letter-spacing: -0.005em; }
h3 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 600; }
p { margin: 0; }
.muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }

/* tool strip */
.tool { display: grid; gap: 14px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand b { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.brand span { color: var(--ink-3); font-size: 0.9rem; }
.controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: stretch; }
@media (max-width: 720px) { .controls { grid-template-columns: 1fr; } }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; background: var(--paper); padding: 16px 18px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop .t { display: grid; gap: 2px; min-width: 0; flex: 1 1 260px; }
.drop .t strong { font-weight: 600; }
.drop .t small { color: var(--ink-3); font-size: 0.85rem; }
.btn { font: inherit; font-weight: 600; font-size: 0.9rem; border-radius: 8px; padding: 9px 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--paper); cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.price { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; min-width: 230px; }
.price label { font-size: 0.8rem; color: var(--ink-2); font-weight: 600; }
.price input { font: inherit; font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--bg); color: var(--ink); width: 100%; }
.status { font-size: 0.9rem; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); }
.status.err { background: var(--bad-bg); color: var(--bad); }
.sample-tag { display: inline-block; font-size: 0.75rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); }

/* report */
.report { display: grid; gap: 28px; }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 18px; min-width: 0; }
@media (max-width: 560px) { .sheet { padding: 18px 16px; } }
.head { display: grid; gap: 10px; }
.head h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.7rem, 4vw, 2.4rem); line-height: 1.15; letter-spacing: -0.01em; }
.ticker { font-family: var(--font-body); font-weight: 700; font-size: 0.85rem; letter-spacing: 0.06em; border: 1.5px solid var(--ink); border-radius: 4px; padding: 1px 7px; vertical-align: 0.4em; margin-left: 6px; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px 24px; border-top: 1px solid var(--line); padding-top: 14px; }
.meta div { display: grid; gap: 1px; min-width: 0; }
.meta dt { font-size: 0.75rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
.meta dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }

.summary { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 24px; }
@media (max-width: 820px) { .summary { grid-template-columns: 1fr; } }
.narr { display: grid; gap: 12px; align-content: start; font-size: 1.02rem; max-width: 68ch; }
.lists { display: grid; gap: 16px; align-content: start; }
.lists ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.score { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; }
.score .v { font-family: var(--font-display); font-size: 2rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score small { color: var(--ink-3); font-size: 0.84rem; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.na { background: var(--na-bg); color: var(--na); }

.tablewrap { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); text-align: left; vertical-align: top; }
thead th { font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.group td { font-weight: 700; color: var(--ink-2); background: var(--line-2); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; }
tr.total td { font-weight: 600; }
td .f { display: block; color: var(--ink-3); font-size: 0.8rem; }
.up { color: var(--good); } .down { color: var(--bad); } .flat { color: var(--ink-3); }

.chart { display: grid; gap: 10px; }
.legend { display: flex; gap: 16px; font-size: 0.85rem; color: var(--ink-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart svg text { fill: var(--ink-2); font-family: var(--font-body); font-size: 12px; }
.chart svg .grid { stroke: var(--line); stroke-width: 1; }
.chart svg .bar:hover { opacity: .8; }
.bsviz { display: grid; gap: 18px; }
.bsrow { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 16px; align-items: center; }
@media (max-width: 560px) { .bsrow { grid-template-columns: 1fr; } }
.bsrow > b { font-weight: 600; }
.bsbar { display: flex; gap: 2px; height: 30px; background: var(--paper); }
.bsbar span { display: block; min-width: 3px; height: 100%; }
.bsbar span:first-child { border-radius: 4px 0 0 4px; } .bsbar span:last-child { border-radius: 0 4px 4px 0; } .bsbar span:only-child { border-radius: 4px; }
.bskey { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 0.86rem; color: var(--ink-2); }
@media (max-width: 560px) { .bskey { grid-column: 1; } }
.bskey i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.bskey .num { color: var(--ink); font-weight: 600; }
.eq { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.4; }
tr.grand td { font-weight: 700; border-top: 1.5px solid var(--ink-3); }
tr.check td { color: var(--ink-3); font-size: 0.85rem; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 0.82rem; padding: 6px 9px; border-radius: 6px; font-variant-numeric: tabular-nums; z-index: 20; }

details { border-top: 1px solid var(--line); padding-top: 12px; }
summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.notes { font-size: 0.86rem; color: var(--ink-2); display: grid; gap: 6px; max-width: 80ch; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
@media print {
  body { background: #fff; }
  .tool, .actions, details summary { display: none; }
  .sheet { border: none; padding: 0; }
  tr, .score, .chart { break-inside: avoid; }
  details > * { display: block; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <section class="tool" aria-label="Unggah laporan keuangan">
    <div class="brand"><b>Analis Lapkeu Emiten</b><span>Laporan keuangan emiten BEI, dari Excel XBRL IDX atau PDF</span></div>
    <div class="controls">
      <label class="drop" id="drop" for="file">
        <input type="file" id="file" accept=".xlsx,.xls,.pdf">
        <span class="t">
          <strong>Pilih atau seret file laporan keuangan ke sini</strong>
          <small>Excel "FinancialStatement-….xlsx" dari idx.co.id (paling akurat) atau PDF laporan keuangan. File dibaca di browser Anda saja dan tidak diunggah ke mana pun.</small>
        </span>
        <span class="btn">Pilih file</span>
      </label>
      <div class="price">
        <label for="price">Harga saham (Rp, opsional)</label>
        <input id="price" type="text" inputmode="decimal" placeholder="mis. 450" autocomplete="off">
        <label for="shares">Jumlah saham beredar (opsional)</label>
        <input id="shares" type="text" inputmode="numeric" placeholder="otomatis dari EPS" autocomplete="off">
        <span class="muted" style="font-size:.78rem">Untuk PER, PBV, dan kapitalisasi pasar.</span>
      </div>
    </div>
    <div id="status" class="status" role="status">Menampilkan contoh: laporan tahunan 2025 PT Astra Agro Lestari Tbk (AALI). Unggah file Anda untuk menganalisis emiten lain.</div>
  </section>

  <main id="report" class="report" aria-live="polite"></main>
</div>
<div id="tip" class="tip" hidden></div>

const isNum = v => typeof v === 'number' && isFinite(v);
const div = (a, b) => (isNum(a) && isNum(b) && b !== 0) ? a / b : null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (d) => new Intl.NumberFormat('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d });

/* ---------- standard line items ---------- */

    if (isNum(rc.roa) && isNum(rp.roa)) add('ROA naik', rc.roa > rp.roa);
    if (isNum(val('cfo', 'c')) && isNum(val('ni', 'c'))) add('Arus kas operasi > laba bersih', val('cfo', 'c') > val('ni', 'c'));

    if (isNum(lev('c')) && isNum(lev('p'))) add('Rasio utang jangka panjang turun', lev('c') <= lev('p'));
    if (isNum(rc.cr) && isNum(rp.cr)) add('Current ratio naik', rc.cr > rp.cr);
    if (has('shareissue') || has('sharecap')) add('Tidak menerbitkan saham baru', !(val('shareissue', 'c') > 0) && !(val('sharecap', 'c') > (val('sharecap', 'p') ?? Infinity)));
    if (isNum(rc.gpm) && isNum(rp.gpm)) add('Margin laba kotor naik', rc.gpm > rp.gpm);
    if (isNum(rc.ato) && isNum(rp.ato)) add('Perputaran aset naik', rc.ato > rp.ato);

  if (financial) { pio.of = 0; pio.tests = []; }

}

// negEq: equity is zero or negative, which flips the sign of every equity-based ratio and would read as healthy
function rate(r, v, negEq) {

/* ---------- formatting ---------- */
let UNIT = { div: 1e9, name: 'miliar' };

  else UNIT = ta >= 1e14 ? { div: 1e12, name: 'triliun Rp' } : ta >= 1e10 ? { div: 1e9, name: 'miliar Rp' } : { div: 1e6, name: 'juta Rp' };
}
const fU = v => { if (!isNum(v)) return '–'; const d = UNIT.div >= 1e12 ? 2 : 1; return v < 0 ? '(' + nf(d).format(Math.abs(v) / UNIT.div) + ')' : nf(d).format(v / UNIT.div); };

  const a = Math.abs(v), s = v < 0 ? '−' : '';
  const p = ccy === 'USD' ? 'US$' : 'Rp';
  if (a >= 1e12) return `${s}${p}${nf(2).format(a / 1e12)} triliun`;
  if (a >= 1e9) return `${s}${p}${nf(1).format(a / 1e9)} miliar`;
  if (a >= 1e6) return `${s}${p}${nf(1).format(a / 1e6)} juta`;

const pct = (v, d = 1) => isNum(v) ? nf(d).format(v * 100) + '%' : '–';
function fR(r, v) {
  if (!isNum(v)) return '–';
  if (r.u === '%') return pct(v, r.d || 1);
  if (r.u === 'hari') return nf(0).format(v) + ' hari';
  return nf(2).format(v) + 'x';
}

  const cls = better == null ? 'flat' : better ? 'up' : 'down';

  const amt = r.u === '%' ? `${nf(r.d || 1).format(Math.abs(diff) * 100)} poin` : r.u === 'hari' ? `${nf(0).format(Math.abs(diff))} hari` : `${nf(2).format(Math.abs(diff))}x`;

/* ---------- narrative ---------- */
function narrative(A) {
  const { S, rc, rp, growth, meta: M } = A, c = M.currency;
  const nm = M.code || (M.name || 'Perusahaan').replace(/^PT\.?\s+/, '').replace(/\s*Tbk\.?$/, '');
  const out = [], plus = [], minus = [];
  const g = k => growth(k);
  const chg = (v) => isNum(v) ? (v >= 0 ? `naik ${pct(v)}` : `turun ${pct(-v)}`) : '';
  // net result, worded for losses and for a swing between profit and loss; up: true when it improved
  const result = v => v < 0 ? `rugi bersih ${money(-v, c)}` : `laba bersih ${money(v, c)}`;
  const ni = S.ni?.c, nip = S.ni?.p;
  let niTxt = '', niUp = null;
  if (isNum(ni)) {
    if (isNum(nip) && (ni < 0) !== (nip < 0)) { niUp = ni >= 0; niTxt = `perusahaan berbalik dari ${result(nip)} menjadi ${result(ni)}`; }
    else if (isNum(nip) && ni < 0) { niUp = ni > nip; niTxt = `rugi bersih ${niUp ? 'menyusut' : 'membesar'} dari ${money(-nip, c)} menjadi ${money(-ni, c)}`; }
    else if (isNum(g('ni'))) { niUp = g('ni') >= 0; niTxt = `laba bersih ${chg(g('ni'))} menjadi ${money(ni, c)}`; }
    else niTxt = result(ni);
  }
  // income
  if (isNum(S.revenue?.c)) {
    let s = `${A.bank ? 'Pendapatan operasional' : 'Pendapatan'} ${nm} ${isNum(g('revenue')) ? chg(g('revenue')) + ' menjadi ' : 'sebesar '}${money(S.revenue.c, c)}`;
    if (niTxt) s += niUp == null ? `, dengan ${niTxt}` : `, ${isNum(g('revenue')) && (g('revenue') >= 0) === niUp ? 'dan' : 'tetapi'} ${niTxt}`;
    s += '.';
    if (isNum(rc.gpm) && isNum(rp.gpm) && Math.abs(rc.gpm - rp.gpm) >= 0.02) {
      const cogsG = g('cogs');
      s += ` Margin laba kotor ${rc.gpm < rp.gpm ? 'menyusut' : 'membaik'} dari ${pct(rp.gpm)} ke ${pct(rc.gpm)}${rc.gpm < rp.gpm && isNum(cogsG) && isNum(g('revenue')) && cogsG > g('revenue') ? `, karena beban pokok naik ${pct(cogsG)}, lebih cepat dari pendapatan` : ''}.`;
    }
    if (isNum(rc.npm)) s += ` Margin laba bersih ${pct(rc.npm)}${isNum(rp.npm) ? ` (tahun sebelumnya ${pct(rp.npm)})` : ''}.`;
    out.push(s);
  } else if (niTxt) out.push(`${nm}: ${niTxt}.`);
  if (A.bank) {
    let s = '';
    if (isNum(S.loans?.c)) s += `Kredit yang diberikan ${isNum(g('loans')) ? chg(g('loans')) + ' menjadi ' : ''}${money(S.loans.c, c)}`;
    if (isNum(S.deposits?.c)) s += `${s ? ', sementara' : 'Dana'} dana pihak ketiga ${isNum(g('deposits')) ? chg(g('deposits')) + ' menjadi ' : ''}${money(S.deposits.c, c)}`;
    if (s) s += '.';
    if (isNum(rc.ldr)) s += ` LDR ${pct(rc.ldr)}${isNum(rc.casar) ? ` dan rasio CASA ${pct(rc.casar)}` : ''}.`;
    if (isNum(S.nii?.c)) s += ` Pendapatan bunga bersih ${money(S.nii.c, c)}${isNum(g('nii')) ? ` (${chg(g('nii'))})` : ''}${isNum(S.noni?.c) ? `, ditambah pendapatan non-bunga ${money(S.noni.c, c)}` : ''}.`;
    if (isNum(S.provision?.c)) s += ` Beban kerugian penurunan nilai ${money(S.provision.c, c)}${isNum(rc.coc) ? `, setara biaya kredit ${pct(rc.coc, 2)}` : ''}.`;
    if (s) out.push(s.trim());
  }
  // balance sheet
  if (isNum(S.ta?.c)) {
    let s = `Total aset ${isNum(g('ta')) ? chg(g('ta')) + ' menjadi ' : ''}${money(S.ta.c, c)}`;
    if (rc.negEq) s += `, sementara ekuitas negatif ${money(S.te.c, c)}: liabilitas melebihi aset`;
    else if (A.bank && isNum(rc.eta)) s += `, dengan ekuitas ${pct(rc.eta)} dari aset`;
    else if (isNum(rc.der)) s += `, dengan DER ${nf(2).format(rc.der)}x${isNum(rp.der) ? ` (dari ${nf(2).format(rp.der)}x)` : ''}`;
    if (isNum(S.netdebt?.c)) s += S.netdebt.c < 0 ? ` dan posisi kas bersih ${money(-S.netdebt.c, c)} (kas melebihi utang berbunga)` : ` dan utang bersih ${money(S.netdebt.c, c)}`;
    s += '.';
    if (isNum(S.shareissue?.c) && S.shareissue.c > 0) s += ` Pada periode ini perusahaan menerima ${money(S.shareissue.c, c)} dari penerbitan saham baru, yang ikut menebalkan ekuitas.`;
    if (isNum(rc.cr)) s += ` Current ratio ${nf(2).format(rc.cr)}x menunjukkan likuiditas jangka pendek ${rc.cr >= 1.5 ? 'kuat' : rc.cr >= 1 ? 'memadai' : 'ketat'}.`;
    out.push(s);
  }
  // cash flow (for banks operating cash flow mostly mirrors deposit and loan movements, so it is left out)
  if (isNum(S.cfo?.c) && !A.financial) {
    let s = `Arus kas operasi ${money(S.cfo.c, c)}${isNum(rc.cfoni) ? `, atau ${nf(2).format(rc.cfoni)}x laba bersih` : ''}.`;
    if (isNum(S.capex?.c)) s += ` Belanja modal ${money(S.capex.c, c)}, sehingga arus kas bebas ${S.fcf.c >= 0 ? 'positif' : 'negatif'} ${money(Math.abs(S.fcf.c), c)}.`;
    if (isNum(S.fcf?.c) && S.fcf.c < 0 && isNum(S.cff?.c) && S.cff.c > 0) s += ` Kekurangan ini ditutup dari pendanaan bersih ${money(S.cff.c, c)}.`;
    out.push(s);
  }

  if (rc.negEq) minus.push('Ekuitas negatif: liabilitas melebihi aset (defisiensi modal)');
  for (const grp of RATIOS) for (const r of grp.rows) {
    if (A.financial && ['cr', 'qr', 'cashr', 'dte', 'nde', 'der', 'dar', 'icr', 'dso', 'cfoni', 'fcfm', 'npm', 'opm'].includes(r.k)) continue;
    // equity-based ratios are covered by the negative-equity line above
    if (rc.negEq && ['der', 'dte', 'nde', 'roe', 'eta'].includes(r.k)) continue;
    const v = rc[r.k], p = rp[r.k], rt = rate(r, v, rc.negEq);
    if (!rt) continue;
    const line = `${r.n} ${fR(r, v)}`;
    const worse = isNum(p) && r.dir !== 0 && ((v - p) * r.dir < 0) && Math.abs(v - p) / (Math.abs(p) || 1) > 0.15;
    if (rt === 'good' && !worse) plus.push(line);
    if (rt === 'bad') minus.push(line);
    else if (worse) minus.push(`${r.n} memburuk: ${fR(r, p)} → ${fR(r, v)}`);
  }
  if (isNum(ni) && ni < 0) minus.push(isNum(nip) && nip >= 0 ? 'Berbalik dari laba menjadi rugi bersih' : `Rugi bersih ${money(-ni, c)}`);
  else if (isNum(ni) && isNum(nip) && nip < 0) plus.push('Berbalik dari rugi menjadi laba bersih');
  for (const k of A.bank ? ['revenue', 'ni', 'loans', 'deposits'] : ['revenue', 'ni']) {
    if (k === 'ni' && ni < 0) continue;
    const v = g(k); if (isNum(v) && v <= -0.1) minus.push(`${ITEMS[k].name} turun ${pct(-v)}`); if (isNum(v) && v >= 0.15) plus.push(`${ITEMS[k].name} tumbuh ${pct(v)}`);
  }
  if (isNum(S.fcf?.c) && S.fcf.c < 0 && !A.financial) minus.push('Arus kas bebas negatif (investasi melebihi kas operasi)');
  return { paras: out, plus: [...new Set(plus)], minus: [...new Set(minus)] };
}

  // valuation

  $('#copy').onclick = () => copySummary(A, N);

// Assets − (liabilities + equity) from figures read off the file. A total derived from the other two always balances,
// so the check needs all three reported (liabilities may come from current + non-current); null when it cannot be tested.
function balanceGap(S, per) {
  const rep = k => S[k] && !S[k].dp?.[per] && isNum(S[k][per]) ? S[k][per] : null;
  const ta = rep('ta') ?? rep('tle');
  const tl = rep('tl') ?? (isNum(rep('cl')) && isNum(rep('ncl')) ? rep('cl') + rep('ncl') : null);
  const te = rep('te');
  return [ta, tl, te].every(isNum) ? ta - tl - te - (rep('syirkah') || 0) : null;
}
// Condensed balance sheet from the standard items, for PDFs whose line-by-line layout cannot be read reliably
function condensedBalance(S, mul) {
  const v = (k, per) => S[k] && isNum(S[k][per]) ? S[k][per] / mul : null;
  const row = (label, f, extra = {}) => { const c = f('c'), p = f('p'); return isNum(c) || isNum(p) ? [{ label, c, p, ...extra }] : []; };
  const rest = (tot, parts) => per => isNum(v(tot, per)) ? v(tot, per) - parts.reduce((a, k) => a + (v(k, per) || 0), 0) : null;
  return [
    { h: 'Aset lancar' }, ...row('Kas dan setara kas', p => v('cash', p)), ...row('Piutang usaha', p => v('recv', p)), ...row('Persediaan', p => v('inv', p)),
    ...row('Aset lancar lainnya', rest('ca', ['cash', 'recv', 'inv'])), ...row('Jumlah aset lancar', p => v('ca', p), { total: true }),
    { h: 'Aset tidak lancar' }, ...row('Jumlah aset tidak lancar', p => v('nca', p), { total: true }),
    ...row('Jumlah aset', p => v('ta', p), { total: true, grand: true }),
    { h: 'Liabilitas jangka pendek' }, ...row('Utang usaha', p => v('pay', p)), ...row('Liabilitas jangka pendek lainnya', rest('cl', ['pay'])), ...row('Jumlah liabilitas jangka pendek', p => v('cl', p), { total: true }),
    { h: 'Liabilitas jangka panjang' }, ...row('Jumlah liabilitas jangka panjang', p => v('ncl', p), { total: true }),
    ...row('Jumlah liabilitas', p => v('tl', p), { total: true, grand: true }),
    { h: 'Ekuitas' }, ...row('Saldo laba', p => v('re', p)), ...row('Ekuitas lainnya (modal, tambahan modal, cadangan)', rest('te', ['re'])), ...row('Jumlah ekuitas', p => v('te', p), { total: true }),
    ...row('Jumlah liabilitas dan ekuitas', p => isNum(v('tl', p)) && isNum(v('te', p)) ? v('tl', p) + v('te', p) : null, { total: true, grand: true }),
  ];
}
function neracaHtml(ex, A, py, cy) {
  const S = A.S, c = A.meta.currency, mul = A.meta.mult;
  if (!isNum(S.ta?.c)) return '';
  const tl = S.tl?.c, te = S.te?.c;
  const segs = (parts, total) => parts.filter(([, v]) => isNum(v) && v > 0).map(([n, v, col]) => ({ n, v, col, pct: v / total }));
  const netLoans = isNum(S.loans?.c) ? S.loans.c - (S.loanallow?.c || 0) : null;
  const assets = A.bank && isNum(netLoans) ? segs([['Kredit (bersih)', netLoans, 'var(--seg-1)'], ['Aset lainnya', S.ta.c - netLoans, 'var(--seg-2)']], S.ta.c)
    : isNum(S.ca?.c) && isNum(S.nca?.c) ? segs([['Aset lancar', S.ca.c, 'var(--seg-1)'], ['Aset tidak lancar', S.nca.c, 'var(--seg-2)']], S.ta.c) : segs([['Total aset', S.ta.c, 'var(--seg-1)']], S.ta.c);
  const right = isNum(S.cl?.c) && isNum(S.ncl?.c) ? [['Liabilitas jangka pendek', S.cl.c, 'var(--seg-3)'], ['Liabilitas jangka panjang', S.ncl.c, 'var(--seg-4)']] : [['Liabilitas', tl, 'var(--seg-3)']];
  const le = segs([...right, ['Dana syirkah temporer', S.syirkah?.c, 'var(--seg-4)'], ['Ekuitas', te, 'var(--seg-5)']], S.ta.c);
  const bar = (name, list) => `<div class="bsrow"><b>${name}</b>
    <div class="bsbar" role="img" aria-label="${esc(name + ': ' + list.map(x => `${x.n} ${pct(x.pct)}`).join(', '))}">${list.map(x => `<span style="width:${(x.pct * 100).toFixed(2)}%;background:${x.col}" data-tip="${esc(`${x.n}: ${money(x.v, c)} (${pct(x.pct)})`)}"></span>`).join('')}</div>
    <div class="bskey">${list.map(x => `<span><i style="background:${x.col}"></i>${esc(x.n)} <span class="num">${money(x.v, c)}</span> · ${pct(x.pct)}</span>`).join('')}</div></div>`;
  const rows = (ex.bsRows?.length ? ex.bsRows : condensedBalance(S, mul)).map(r => r.h
    ? `<tr class="group"><td colspan="3">${esc(r.h)}</td></tr>`
    : `<tr class="${r.grand ? 'grand' : r.total ? 'total' : ''}"><td>${esc(r.label)}</td><td class="n">${fU(isNum(r.p) ? r.p * mul : null)}</td><td class="n">${fU(isNum(r.c) ? r.c * mul : null)}</td></tr>`).join('');
  const diff = per => balanceGap(S, per);
  return `<section class="sheet">
    <h2>Neraca</h2>
    <p class="eq">Aset ${money(S.ta.c, c)} = Liabilitas ${money(tl, c)}${isNum(S.syirkah?.c) && S.syirkah.c ? ` + Dana syirkah temporer ${money(S.syirkah.c, c)}` : ''} + Ekuitas ${money(te, c)}</p>
    <p class="muted" style="font-size:.86rem">Posisi per ${esc(dateId(A.meta.periodEnd))}. ${isNum(tl) ? `${pct(tl / S.ta.c)} aset dibiayai liabilitas dan ${pct(te / S.ta.c)} oleh ekuitas.` : ''}</p>
    <div class="bsviz">${bar('Aset', assets)}${bar('Liabilitas + ekuitas', le)}</div>
    ${rows ? `<div class="tablewrap"><table><thead><tr><th>Pos neraca (dalam ${UNIT.name})</th><th class="n">${py}</th><th class="n">${cy}</th></tr></thead><tbody>${rows}
      <tr class="check"><td>Cek: aset − (liabilitas + ekuitas)</td><td class="n">${fU(diff('p'))}</td><td class="n">${fU(diff('c'))}</td></tr></tbody></table></div>` : ''}
    ${ex.bsRows?.length ? '' : '<p class="muted" style="font-size:.84rem">Neraca ringkas. Rincian per pos tersedia bila Anda memakai file Excel IDX atau PDF format XBRL IDX.</p>'}
  </section>`;
}

function chartSvg(A, py, cy) {
  const keys = (A.bank ? [['revenue', 'Pendapatan operasional'], ['nii', 'Bunga bersih'], ['ebit', 'Laba operasional'], ['ni', 'Laba bersih']]
    : [['revenue', 'Pendapatan'], ['gross', 'Laba bruto'], ['ebit', 'EBIT'], ['ni', 'Laba bersih'], ['cfo', 'Arus kas operasi'], ['fcf', 'Arus kas bebas']])
    .filter(([k]) => A.S[k] && (isNum(A.S[k].c) || isNum(A.S[k].p)));
  if (!keys.length) return '<p class="muted">Data tidak cukup untuk grafik.</p>';
  const vals = keys.flatMap(([k]) => [A.S[k].c, A.S[k].p]).filter(isNum);
  const max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  const W = 760, H = 300, L = 54, R = 12, T = 14, B = 42;
  const step = niceStep((max - min) / UNIT.div / 4);
  const top = Math.ceil(max / UNIT.div / step) * step, bot = Math.floor(min / UNIT.div / step) * step;
  const y = v => T + (top - v / UNIT.div) / (top - bot || 1) * (H - T - B);
  const gw = (W - L - R) / keys.length, bw = Math.min(34, gw * 0.3);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik batang kinerja ${py} dan ${cy}">`;
  for (let t = bot; t <= top + 1e-9; t += step) {
    s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t * UNIT.div)}" y2="${y(t * UNIT.div)}" ${Math.abs(t) < 1e-9 ? 'style="stroke:var(--ink-3)"' : ''}/>`;
    s += `<text x="${L - 8}" y="${y(t * UNIT.div) + 4}" text-anchor="end">${nf(0).format(t)}</text>`;
  }
  keys.forEach(([k, label], i) => {
    const cx = L + gw * i + gw / 2;
    [[A.S[k].p, 'var(--series-prev)', py, -1], [A.S[k].c, 'var(--series-cur)', cy, 1]].forEach(([v, col, year, side]) => {
      if (!isNum(v)) return;
      const x = cx + (side < 0 ? -bw - 1 : 1);
      const y0 = y(0), y1 = y(v);
      const h = Math.max(1, Math.abs(y1 - y0));
      const r = Math.min(4, h);
      const yTop = Math.min(y0, y1);
      // rounded data-end, square at baseline
      const path = v >= 0
        ? `M${x},${y0} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + bw - r} Q${x + bw},${yTop} ${x + bw},${yTop + r} V${y0} Z`
        : `M${x},${y0} V${y0 + h - r} Q${x},${y0 + h} ${x + r},${y0 + h} H${x + bw - r} Q${x + bw},${y0 + h} ${x + bw},${y0 + h - r} V${y0} Z`;
      s += `<path class="bar" d="${path}" style="fill:${col}" data-tip="${esc(label)} ${year}: ${esc(money(v, A.meta.currency))}"/>`;
    });
    s += `<text x="${cx}" y="${H - B + 18}" text-anchor="middle">${esc(label)}</text>`;
  });
  return s + '</svg>';
}
function niceStep(raw) {
  if (!(raw > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function bindTips() {
  const tip = $('#tip');
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mousemove', e => { tip.textContent = el.dataset.tip; tip.hidden = false; tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY - 34) + 'px'; });
    el.addEventListener('mouseleave', () => tip.hidden = true);
  });
}
function copySummary(A, N) {
  const M = A.meta;
  const txt = [`${M.name}${M.code ? ' (' + M.code + ')' : ''} · ${dateId(M.periodEnd)}`, '', ...N.paras, '', 'Kekuatan:', ...N.plus.map(x => '- ' + x), '', 'Perlu diperhatikan:', ...N.minus.map(x => '- ' + x)].join('\n');
  const btn = $('#copy');
  const done = () => { btn.textContent = 'Tersalin'; setTimeout(() => btn.textContent = 'Salin ringkasan', 1800); };
  try {
    navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  } catch (e) { fallbackCopy(txt, done); }
}
function fallbackCopy(txt, done) {
  const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  ta.remove();
}
// Indonesian format ("1.250", "12,5"); a single dot followed by one or two digits is a decimal point ("12.5")
function parsePrice(s) {
  s = String(s || '').replace(/\s|rp/gi, '');
  const v = /^\d+\.\d{1,2}$/.test(s) ? parseFloat(s) : parseFloat(s.replace(/\./g, '').replace(',', '.'));
  return v > 0 ? v : null;
}

/* ---------- wiring ---------- */
let SAMPLE_EX = null, LAST_EX = null;
function setStatus(msg, err) { const s = $('#status'); s.textContent = msg; s.classList.toggle('err', !!err); }
async function handleFile(file) {
  if (!file) return;
  const name = file.name || 'file';
  try {
    setStatus(`Membaca ${name}…`);
    const buf = await file.arrayBuffer();
    let ex;
    if (/\.pdf$/i.test(name) || file.type === 'application/pdf') {
      const raw = await parsePdf(buf, name, (n, t) => setStatus(`Membaca ${name}… halaman ${n} dari ${t}`));
      ex = raw.source === 'idxpdf' ? extractExcel(raw) : extractPdf(raw);
    } else {
      ex = extractExcel(parseExcel(buf, name));
    }
    const n = Object.keys(ex.data).length;
    if (!n) throw new Error('Tidak ada pos laporan keuangan yang terbaca. Pastikan file ini berisi laporan posisi keuangan, laba rugi, atau arus kas.');
    LAST_EX = ex;
    render(ex);
    setStatus(`Selesai: ${name} terbaca (${n} pos standar).${ex.meta.source.startsWith('PDF') ? ' Hasil dari PDF adalah pembacaan otomatis; cek bagian "Dari mana angka ini" di bawah.' : ''}`);
  } catch (e) {
    console.error(e);
    const shown = LAST_EX ? ` Laporan di bawah masih dari ${LAST_EX === SAMPLE_EX ? 'contoh AALI' : LAST_EX.meta.file || 'file sebelumnya'}.` : '';
    setStatus(`Gagal membaca ${name}: ${e.message || e}${shown}`, true);
  }
}
// clear the input so picking the same file again still triggers a read
$('#file').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });
const drop = $('#drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
['#price', '#shares'].forEach(id => $(id).addEventListener('input', () => { if (LAST_EX) render(LAST_EX); }));

if (SAMPLE) { SAMPLE_EX = extractExcel(SAMPLE); LAST_EX = SAMPLE_EX; render(SAMPLE_EX); }
window.__analis = { parseExcel, extractExcel, parsePdf, extractPdf, analyze, handleFile };
</script>
